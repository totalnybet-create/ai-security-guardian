name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :core-security:test --stacktrace --no-daemon 2>&1 | tee core-security-test.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee apk-build.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ci-diagnostics
          if-no-files-found: ignore
          path: |
            core-security-test.log
            apk-build.log
            **/build/reports/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-guardian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
