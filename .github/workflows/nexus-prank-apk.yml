name: Build Nexus Prank APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'nexus-prank-android/**'
      - '.github/workflows/nexus-prank-apk.yml'

jobs:
  build:
    if: github.head_ref == 'build/nexus-prank-apk-v11'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p nexus-prank-android :app:assembleDebug --stacktrace

      - name: Verify APK package
        shell: bash
        run: |
          APK="nexus-prank-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          cp "$APK" Nexus-Prank-v11.apk
          sha256sum Nexus-Prank-v11.apk > Nexus-Prank-v11.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Prank-v11-APK
          path: |
            Nexus-Prank-v11.apk
            Nexus-Prank-v11.apk.sha256
          if-no-files-found: error
          retention-days: 14
