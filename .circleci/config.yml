version: 2.1

jobs:
  android-build:
    docker:
      - image: cimg/android:2026.07
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify Java and Gradle
          command: |
            java -version
            gradle -v
      - run:
          name: Install Android 16 SDK
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run:
          name: Core security tests
          command: gradle :core-security:test --stacktrace
      - run:
          name: Build debug APK
          command: gradle :app:assembleDebug --stacktrace
      - store_test_results:
          path: core-security/build/test-results/test
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: ai-security-guardian-debug.apk

workflows:
  guardian-ci:
    jobs:
      - android-build
